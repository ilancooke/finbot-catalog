[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finbot-catalog"
version = "0.1.0"
description = "Lightweight metadata catalog builder for Finbot datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
finbot-build-catalog = "finbot_catalog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
